<html>
    <head><link href="style.css" rel="stylesheet"><script src="script.js"></script><link href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" rel="stylesheet"></head>
    <body>
        <div id="top">
            <img src="https://assets.turbologo.com/blog/en/2019/09/19084953/instagram-logo-illustration.png" width=200px height="100px"/>
            <input type="search" value="🔍검색"/>
            <div><i class="far fa-home"></i><i class="far fa-paper-plane"></i><i class="far fa-compass"></i><i class="far fa-heart"></i></div>
        </div>
        <div id="profile">
            <div id="profile_pic">
                <img class="circle_pic" src="https://bhban.kr/instagram/image/profile.jpg"/>
            </div>
            <div id="profile_info">
                <div id="id">
                    <span>insta_name</span>
                    <i class="fas fa-cog"></i>
                </div>
                <button>프로필 편집</button>
            </div>
        </div>
        <div>
            <p id="userInfo"><strong>이름</strong></p>
            <p id="summary">무직</p>
            <a id="profileDetail" href="https://google.com/">google</a>
            <p>github_id</p>
        </div>
        <div>
            <div id="highlight_area">
                <div class="highlight">
                    <div class="highlight_pic">
                        <img class="circle_pic" src="https://bhban.kr/instagram/image/hl%201.jpg"/>
                    </div>
                    <div>😒</div>
                </div>
                <div class="highlight">
                    <div class="highlight_pic">
                        <img class="circle_pic" src="https://bhban.kr/instagram/image/hl%202.jpg"/>
                    </div>
                    <div>😑</div>
                </div>
                <div></div>
            </div>
        </div>
        <div id="stat_bar">
            <div class="stat">
                게시물<br/>
                111
            </div>
            <div class="stat">
                팔로워<br/>
                222
            </div>
            <div class="stat">
                팔로우<br/>
                333
            </div>
        </div>
        <div id="sub_icons">
            <div class="selected">
                <i class="fas fa-border-all"></i></div>
                <div><i class="fas fa-film"></i></div>
                <div><i class="far fa-play-circle"></i></div>
                <div><i class="far fa-bookmark"></i></div>
                <div><i class="far fa-user-tag"></i></div>
            </div>
        </div>
        <div>
            <div class="thumnail_grid">
                <img src="https://bhban.kr/instagram/image/thumnails/1.jpg"/>
                <img src="https://bhban.kr/instagram/image/thumnails/2.jpg"/>
                <img src="https://bhban.kr/instagram/image/thumnails/3.jpg"/>
            </div>
            <div class="thumnail_grid">
                <img src="https://bhban.kr/instagram/image/thumnails/4.jpg"/>
                <img src="https://bhban.kr/instagram/image/thumnails/5.jpg"/>
                <img src="https://bhban.kr/instagram/image/thumnails/6.jpg"/>
            </div>
            <div class="thumnail_grid">
                <img src="https://bhban.kr/instagram/image/thumnails/7.jpg"/>
                <img src="https://bhban.kr/instagram/image/thumnails/8.jpg"/>
                <img src="https://bhban.kr/instagram/image/thumnails/9.jpg"/>
            </div>
        </div>
    </body>
</html>
